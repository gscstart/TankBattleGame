name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: pytest (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # 无头 SDL (GitHub Actions runner 无显示器/音频设备)
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pytest tests/ -v --tb=short

      - name: Run script-style tests (visual/integration)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          # 这些是脚本式测试, pytest 不收集, 但仍跑确保无 crash
          python tests/test_chinese_menu.py && \
          python tests/test_gameplay.py && \
          python tests/test_visual.py

      - name: Upload coverage on failure
        if: failure()
        # 不强求 coverage, 失败时只跑测试
        run: echo "Tests failed - see logs above"
